{% extends "administration/admin_base.html" %}
{% load static %}
{% block title %} Create Test {% endblock %}
{% block content %}

{% block page_style %}
<!-- <link type="text/css" href="{% static 'styles/auth.css' %}" rel="stylesheet" /> -->
<link type="text/css" href="{% static 'style/form.css' %}" rel="stylesheet" />
{% endblock %}

<!-- Main dashboard section-->
<div id="home" class="tabcontent">

    <a href="{% url 'administration:test_mgmt' %}">
        <div class="back_icn_container">
            <img src="{% static 'img/icns/back.svg' %}" />
        </div>
    </a>

  <ul>

    <div class="form_container">
        <h3>Create Test </h3>
            
        <form method="post"  enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <center>
                <button type="submit">Save Action</button>
            </center>
        </form>
    </div>

</div>


{% endblock %}
